# Named AOI scenes for --aoi convenience resolution.
#
# Usage:  solarsoiled run --aoi santa_cruz --weights production ...
#
# Each entry is a WGS84 bbox: [minx, miny, maxx, maxy]
# Keys are matched case-insensitively; spaces and hyphens normalize to underscores.
#
# Add new scenes here — no code changes required.

# ── California ───────────────────────────────────────────────────────────────

santa_cruz:
  bbox: [-122.10, 36.85, -121.85, 37.05]
  notes: Santa Cruz metro + Pajaro Valley

san_jose:
  bbox: [-122.05, 37.20, -121.75, 37.45]
  notes: San Jose / South Bay

fresno:
  bbox: [-119.90, 36.65, -119.65, 36.85]
  notes: Fresno urban + surrounding ag

bakersfield:
  bbox: [-119.15, 35.28, -118.90, 35.48]
  notes: Bakersfield city + oil-field adjacent panels

los_angeles:
  bbox: [-118.50, 33.90, -118.10, 34.15]
  notes: LA basin

san_diego:
  bbox: [-117.30, 32.65, -116.95, 32.85]
  notes: San Diego metro

palm_springs:
  bbox: [-116.65, 33.75, -116.45, 33.90]
  notes: Coachella Valley — high soiling risk

sacramento:
  bbox: [-121.65, 38.45, -121.35, 38.65]
  notes: Sacramento metro

