<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="grid2" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="600" height="400" fill="#1c2b3a"/>
  <rect width="600" height="400" fill="url(#grid2)"/>
  <rect x="0" y="0" width="440" height="400" fill="#1e3040" opacity=".5"/>

  <!-- road -->
  <rect x="0" y="190" width="440" height="8" fill="#243a4e" opacity=".9"/>

  <!-- Array A — high risk -->
  <polygon points="30,30 200,24 208,100 36,108" fill="rgba(220,50,47,0.3)" stroke="#dc322f" stroke-width="2"/>
  <text x="119" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#fff" font-weight="600">Risk: 0.82</text>

  <!-- Array B — medium -->
  <polygon points="220,28 380,22 386,90 226,96" fill="rgba(247,183,49,0.28)" stroke="#F7B731" stroke-width="2"/>
  <text x="303" y="65" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#fff" font-weight="600">Risk: 0.54</text>

  <!-- Array C — low risk -->
  <polygon points="30,210 190,205 196,270 35,276" fill="rgba(72,199,120,0.28)" stroke="#48c778" stroke-width="2"/>
  <text x="113" y="246" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#fff" font-weight="600">Risk: 0.21</text>

  <!-- Array D — medium-high -->
  <polygon points="210,208 380,203 385,268 215,273" fill="rgba(255,107,53,0.28)" stroke="#ff6b35" stroke-width="2"/>
  <text x="298" y="244" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#fff" font-weight="600">Risk: 0.67</text>

  <!-- Array E — low -->
  <polygon points="30,295 220,290 224,350 34,355" fill="rgba(72,199,120,0.28)" stroke="#48c778" stroke-width="2"/>
  <text x="127" y="328" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#fff" font-weight="600">Risk: 0.18</text>

  <!-- side panel -->
  <rect x="450" y="0" width="150" height="400" fill="rgba(10,20,30,.92)"/>
  <text x="525" y="30" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,.5)" font-weight="600" letter-spacing="1">AOI SUMMARY</text>

  <text x="462" y="58" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,.45)">Arrays detected</text>
  <text x="462" y="74" font-family="Space Grotesk,sans-serif" font-size="22" fill="#fff" font-weight="700">334</text>

  <text x="462" y="104" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,.45)">High risk (&gt;0.65)</text>
  <text x="462" y="120" font-family="Space Grotesk,sans-serif" font-size="22" fill="#ff6b35" font-weight="700">47</text>

  <text x="462" y="150" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,.45)">Ready to clean</text>
  <text x="462" y="166" font-family="Space Grotesk,sans-serif" font-size="22" fill="#F7B731" font-weight="700">23</text>

  <line x1="462" y1="186" x2="588" y2="186" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

  <text x="462" y="206" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,.45)">Est. annual yield loss</text>
  <text x="462" y="222" font-family="Space Grotesk,sans-serif" font-size="18" fill="#fff" font-weight="700">3.2%</text>
  <text x="462" y="236" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,.3)">from soiling</text>

  <line x1="462" y1="256" x2="588" y2="256" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
  <text x="462" y="274" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,.45)" font-weight="600" letter-spacing="1">RISK LEGEND</text>
  <rect x="462" y="282" width="10" height="10" rx="2" fill="#48c778"/>
  <text x="478" y="291" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,.7)">Low  &lt;0.35</text>
  <rect x="462" y="298" width="10" height="10" rx="2" fill="#F7B731"/>
  <text x="478" y="307" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,.7)">Med  0.35–0.65</text>
  <rect x="462" y="314" width="10" height="10" rx="2" fill="#ff6b35"/>
  <text x="478" y="323" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,.7)">High  0.65–0.80</text>
  <rect x="462" y="330" width="10" height="10" rx="2" fill="#dc322f"/>
  <text x="478" y="339" font-family="Inter,system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,.7)">Crit  &gt;0.80</text>

  <rect x="462" y="364" width="126" height="24" rx="4" fill="rgba(44,83,100,.8)"/>
  <text x="525" y="380" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,.65)">XGBoost · CV AUC 0.63 · beta</text>
</svg>
