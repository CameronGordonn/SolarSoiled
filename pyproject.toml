[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarsoiled"
version = "0.5.0"
description = "SolarSoiled — solar array detection (YOLOv11) + soiling-risk scoring (XGBoost) on public aerial imagery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cameron Gordon", email = "camerongordon8888@gmail.com" },
]
keywords = ["solar", "remote-sensing", "yolo", "segmentation", "soiling", "geospatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "rasterio>=1.3",
    "geopandas>=0.13",
    "shapely>=2.0",
    "pyproj>=3.5",
    "geojson>=3.0",
    "Pillow>=9.4",
    "scikit-image>=0.20",
    "torch>=2.0",
    "ultralytics>=8.3",
    "scikit-learn>=1.2",
    "xgboost>=1.7",
    "roboflow>=1.0",
    "sahi>=0.11",
    "requests-cache>=1.1",
    "PyYAML>=6.0",
    "typer>=0.9",
    "pytorch-lightning>=2.0",
    "timm>=0.9",
    "torchmetrics>=1.0",
    "folium>=0.14",
]

[project.scripts]
solarsoiled = "solarsoiled.cli:app"

[project.optional-dependencies]
geoai = ["geoai-py"]
dev = [
    "pytest>=7.0",
    "pip-tools>=7.0",
]

[project.urls]
Homepage = "https://github.com/camerongordon/solar-soiling-ml"

[tool.setuptools.packages.find]
where = ["src"]
include = ["solarsoiled*"]
namespaces = true
